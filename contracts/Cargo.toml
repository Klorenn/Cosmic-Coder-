[workspace]
members = ["zk_types", "groth16_verifier", "ultrahonk_verifier", "cosmic_coder"]


resolver = "2"

# Soroban-recommended release profile (applies to every member; per-crate profiles are ignored by cargo).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
